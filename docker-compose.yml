# Local Postgres for development: `docker compose up -d`, then `npm run db:migrate`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: standing
      POSTGRES_PASSWORD: standing
      POSTGRES_DB: standing
    ports:
      - "5432:5432"
    volumes:
      - standing-db:/var/lib/postgresql/data

volumes:
  standing-db:
